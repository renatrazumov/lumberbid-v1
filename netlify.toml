# lumber.bid — static front door on timber.bid's backend.
#
# Still no npm / Astro / bundler. The only "build" is the contract suite
# (scripts/test.sh): plain Node, no install. A broken shared-contract pin
# fails the Netlify deploy instead of shipping. When the lumber vertical
# grows real content, this becomes a real Astro build (mirroring wood.delivery).
#
# No secrets in this repo — public client only. NEVER a Supabase service_role key.
# No GitHub Actions on purpose — Netlify build minutes already gate deploys.

[build]
  command = "bash scripts/test.sh"
  publish = "site"

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # One first-party script (site/waitlist.js) and ONE permitted connect
    # target: the shared Supabase project, for the waitlist insert. Everything
    # else stays denied. form-action stays 'none' on purpose — the form is
    # intercepted by JS and must never fall through to a native POST.
    # img-src admits the Supabase project because lot photos are public-bucket
    # URLs on that origin (site/lots.js renders them straight from
    # listings.images). Without it the strip fetches fine and every photo is
    # silently blocked -- a CSP failure looks like missing images, not an
    # error. Same origin as connect-src; no new third party.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; connect-src https://uuzqezohkqgsbbxyzvvv.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://uuzqezohkqgsbbxyzvvv.supabase.co; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
