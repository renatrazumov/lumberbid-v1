# Contract pins — keep lumber.bid in sync with timberbid-v1 shared shapes.
#
# No build step, no package.json: plain node test runners only.
name: contract

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run contract + behavior tests
        run: |
          set -e
          for t in test/*.test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
